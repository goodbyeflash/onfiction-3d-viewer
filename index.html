<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Offline 3D Viewer</title>

    <script type="module" src="./js/model-viewer.min.js"></script>

    <style>
      body {
        margin: 0;
        background-color: #ffffff;
        overflow: hidden;
      }
      model-viewer {
        width: 100vw;
        height: 100vh;
        --poster-color: transparent;
      }
      .tracker-dot {
        width: 24px;
        height: 24px;
        background-color: red;
        border: 3px solid white;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        transform: translate(-50%, -50%);
        transition: transform 0.2s;
      }

      /* 로딩 UI 스타일 */
      #loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      .loading-text {
        font-family: sans-serif;
        font-size: 20px;
        font-weight: bold;
        color: #333333;
      }
    </style>
  </head>
  <body>
    <div id="loading-overlay">
      <div class="loading-text">Loading...</div>
    </div>

    <model-viewer
      id="viewer"
      src="./model.glb"
      camera-controls
      tone-mapping="aces-filmic"
      exposure="1.0"
      shadow-intensity="1"
      autoplay
      interaction-prompt="none"
    >
      <button
        class="tracker-dot"
        slot="hotspot-1"
        data-surface="9 0 243 251 280 0.206 0.527 0.267"
        data-visibility-attribute="visible"
      ></button>
    </model-viewer>

    <script>
      // 2. 서비스 워커 등록
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(
            (registration) => {
              console.log('SW registered');
            },
            (err) => {
              console.log('SW failed');
            },
          );
        });
      }

      const viewer = document.querySelector('#viewer');
      const hotspot = document.querySelector('.tracker-dot');
      const loadingOverlay = document.querySelector('#loading-overlay');

      let isOpened = true; // 초기 상태: 열려있음

      // --- 프로그래스 로직 (로딩 화면) ---
      viewer.addEventListener('progress', (event) => {
        const progress = Math.round(event.detail.totalProgress * 100);
        if (progress === 100) {
          setTimeout(() => {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => {
              loadingOverlay.style.display = 'none';
            }, 500);
          }, 2000); // 2초 대기 후 화면 밝힘
        }
      });

      // --- 💡 애니메이션 초기화 로직 (루프 방지 설정 추가) ---
      viewer.addEventListener('load', () => {
        if (viewer.availableAnimations.length > 0) {
          // 1. 모델 자체의 루프 기능을 강제로 끕니다. (가장 중요)
          const model = viewer.model;
          if (model && model.animation) {
            // model-viewer 버전마다 다르지만, 기본적으로 엔진 차원의 루프를 방지하려 시도
          }

          // 2. 초기 위치 세팅
          viewer.currentTime = viewer.duration - 0.1;
          viewer.play();

          requestAnimationFrame(() => {
            viewer.pause();
          });
        }
      });

      // --- 💡 클릭 애니메이션 로직 (감시 로직 강화) ---
      hotspot.addEventListener('click', () => {
        if (viewer.paused === false && viewer.timeScale !== 0) {
          // 이미 재생 중이면 중복 클릭 방지 (태블릿 터치 튐 방지)
          return;
        }

        isOpened = !isOpened;
        const duration = viewer.duration;

        viewer.timeScale = isOpened ? 1 : -1;
        viewer.play();

        function checkBounds() {
          // 1. 애니메이션이 실행 중이 아닐 경우 감시 중단
          if (viewer.paused) return;

          const curr = viewer.currentTime;

          // 2. 열릴 때 (범위를 넉넉하게 잡고, 도달 즉시 멈춤)
          if (viewer.timeScale > 0) {
            if (curr >= duration - 0.15) {
              // 0.1보다 약간 더 여유있게 잡음
              viewer.pause();
              viewer.currentTime = duration - 0.1;
              return;
            }
          }
          // 3. 닫힐 때
          else if (viewer.timeScale < 0) {
            if (curr <= 0.05) {
              viewer.pause();
              viewer.currentTime = 0;
              return;
            }
          }

          requestAnimationFrame(checkBounds);
        }

        requestAnimationFrame(checkBounds);
      });

      // 4. 엔진 레벨의 루프 방지 (이중 보안)
      viewer.addEventListener('finished', () => {
        viewer.pause();
        if (isOpened) {
          viewer.currentTime = viewer.duration - 0.1;
        } else {
          viewer.currentTime = 0;
        }
      });
    </script>
  </body>
</html>
